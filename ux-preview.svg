  <text x="376" y="628" class="ui" fill="#313135" font-size="12" font-weight="600">informe-anual.pdf</text>
  <text x="376" y="648" class="ui" fill="#929196" font-size="10">12 páginas · 2.4 MB</text>
  <text x="942" y="639" class="ui" fill="#aaa9ad" font-size="18" text-anchor="middle">⋮⋮</text>

  <rect x="312" y="675" width="670" height="66" rx="6" fill="#fff" stroke="#e9e7e3"/>
  <g transform="translate(331 691)">
    <rect width="30" height="34" rx="4" fill="#f7e8e5"/>
    <path d="M8 7h9l5 5v15H8zM17 7v5h5" fill="none" stroke="#b43a29" stroke-width="1.3"/>
    <text x="15" y="23" class="ui" fill="#a63a2a" font-size="6.5" font-weight="700" text-anchor="middle">PDF</text>
  </g>
  <text x="376" y="702" class="ui" fill="#313135" font-size="12" font-weight="600">contrato-firmado.pdf</text>
  <text x="376" y="722" class="ui" fill="#929196" font-size="10">8 páginas · 1.1 MB</text>
  <text x="942" y="713" class="ui" fill="#aaa9ad" font-size="18" text-anchor="middle">⋮⋮</text>

  <rect x="312" y="749" width="670" height="66" rx="6" fill="#fff" stroke="#e9e7e3"/>
  <g transform="translate(331 765)">
    <rect width="30" height="34" rx="4" fill="#f7e8e5"/>
    <path d="M8 7h9l5 5v15H8zM17 7v5h5" fill="none" stroke="#b43a29" stroke-width="1.3"/>
    <text x="15" y="23" class="ui" fill="#a63a2a" font-size="6.5" font-weight="700" text-anchor="middle">PDF</text>
  </g>
  <text x="376" y="776" class="ui" fill="#313135" font-size="12" font-weight="600">anexos.pdf</text>
  <text x="376" y="796" class="ui" fill="#929196" font-size="10">8 páginas · 860 KB</text>
  <text x="942" y="787" class="ui" fill="#aaa9ad" font-size="18" text-anchor="middle">⋮⋮</text>

  <text x="312" y="864" class="ui" fill="#98979b" font-size="10">Puedes cambiar el orden arrastrando los archivos.</text>
  <text x="312" y="885" class="ui" fill="#98979b" font-size="10">Límite por archivo: 50 MB.</text>

  <!-- Summary panel -->
  <rect x="1034" y="324" width="366" height="594" rx="9" fill="#fff" stroke="#e6e4e0" filter="url(#shadow)"/>
  <text x="1064" y="365" class="ui" fill="#262629" font-size="16" font-weight="650">Resumen</text>
  <text x="1064" y="390" class="ui" fill="#858489" font-size="11">Antes de crear tu documento</text>
  <line x1="1064" y1="412" x2="1370" y2="412" stroke="#eceae7"/>

  <text x="1064" y="449" class="ui" fill="#858489" font-size="11">ARCHIVOS</text>
  <text x="1370" y="449" class="ui" fill="#29292c" font-size="13" font-weight="600" text-anchor="end">3 PDF</text>
  <text x="1064" y="483" class="ui" fill="#858489" font-size="11">PÁGINAS TOTALES</text>
  <text x="1370" y="483" class="ui" fill="#29292c" font-size="13" font-weight="600" text-anchor="end">28 páginas</text>
  <text x="1064" y="517" class="ui" fill="#858489" font-size="11">TAMAÑO APROX.</text>
  <text x="1370" y="517" class="ui" fill="#29292c" font-size="13" font-weight="600" text-anchor="end">4.4 MB</text>

  <rect x="1064" y="552" width="306" height="69" rx="6" fill="#f7f5f2"/>
  <circle cx="1087" cy="576" r="10" fill="#e7efe7"/>
  <path d="M1082 576l3 3 6-7" fill="none" stroke="#608469" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1106" y="575" class="ui" fill="#424247" font-size="11" font-weight="600">Tus archivos están listos</text>
  <text x="1106" y="595" class="ui" fill="#858489" font-size="10">El orden puede ajustarse antes de unir.</text>

  <rect x="1064" y="650" width="306" height="49" rx="6" fill="url(#red)"/>
  <g transform="translate(1150 663)" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 3h9l4 4v14H3zM12 3v5h4M6 12h7M6 16h7"/>
  </g>
  <text x="1211" y="681" class="ui" fill="#fff" font-size="13" font-weight="650" text-anchor="middle">Unir archivos</text>

  <text x="1217" y="731" class="ui" fill="#88878c" font-size="10" text-anchor="middle">El PDF resultante se descargará</text>
  <text x="1217" y="747" class="ui" fill="#88878c" font-size="10" text-anchor="middle">directamente en tu dispositivo.</text>

  <line x1="1064" y1="779" x2="1370" y2="779" stroke="#eceae7"/>
  <text x="1064" y="808" class="ui" fill="#4a494e" font-size="11" font-weight="600">¿Necesitas separar páginas?</text>
  <text x="1064" y="829" class="ui" fill="#858489" font-size="10">Usa Dividir PDF para extraer rangos</text>
  <text x="1064" y="846" class="ui" fill="#858489" font-size="10">o crear un archivo por página.</text>
  <text x="1064" y="881" class="ui" fill="#a63a2a" font-size="11" font-weight="650">Ir a Dividir PDF <tspan font-size="14">→</tspan></text>

  <text x="282" y="958" class="ui" fill="#aaa9ad" font-size="10">KEM PDF · Herramientas sencillas para tus documentos</text>
  <text x="1400" y="958" class="ui" fill="#aaa9ad" font-size="10" text-anchor="end">Vista previa UX · Escritorio</text>
