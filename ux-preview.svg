<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 1440 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Vista previa UX de KEM PDF</title>
  <desc id="desc">Panel de gestión de PDF de KEM con opciones para unir y dividir documentos.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#242426" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c74631"/>
      <stop offset="1" stop-color="#a82f20"/>
    </linearGradient>
    <style>
      .ui { font-family: 'Segoe UI', Arial, sans-serif; }
      .display { font-family: Georgia, 'Times New Roman', serif; }
    </style>
  </defs>

  <rect width="1440" height="1000" fill="#f3f2ef"/>

  <!-- Sidebar -->
  <rect width="244" height="1000" fill="#171719"/>
  <image x="58" y="20" width="128" height="128" preserveAspectRatio="xMidYMid meet" xlink:href="logo.png"/>
  <line x1="28" y1="166" x2="216" y2="166" stroke="#343437"/>
  <text x="30" y="204" class="ui" fill="#87868a" font-size="11" font-weight="700" letter-spacing="1.4">HERRAMIENTAS</text>

  <rect x="16" y="222" width="212" height="50" rx="7" fill="#302321"/>
  <rect x="16" y="222" width="3" height="50" rx="1.5" fill="#c74631"/>
  <g transform="translate(37 237)" fill="none" stroke="#e2644d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
