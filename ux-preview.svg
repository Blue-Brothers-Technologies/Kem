  </g>
  <text x="76" y="253" class="ui" fill="#fff" font-size="14" font-weight="600">Unir PDF</text>

  <g transform="translate(37 294)" fill="none" stroke="#a5a4a7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 1h13l6 6v18H3z"/><path d="M16 1v7h6M6 14h13M12 11l-3 3 3 3M12 19l3-3-3-3"/>
  </g>
  <text x="76" y="312" class="ui" fill="#c2c1c4" font-size="14">Dividir PDF</text>

