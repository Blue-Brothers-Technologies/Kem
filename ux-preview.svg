  </g>
  <text x="647" y="495" class="ui" fill="#343438" font-size="13" font-weight="600" text-anchor="middle">Arrastra tus PDF aquí</text>
  <text x="647" y="516" class="ui" fill="#858489" font-size="11" text-anchor="middle">o <tspan fill="#b43a29" font-weight="600">selecciona archivos</tspan> desde tu dispositivo</text>

  <text x="312" y="584" class="ui" fill="#343438" font-size="12" font-weight="650">3 archivos seleccionados</text>
  <text x="982" y="584" class="ui" fill="#a43a2c" font-size="11" text-anchor="end">Quitar todos</text>

