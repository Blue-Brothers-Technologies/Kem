  <rect x="312" y="601" width="670" height="66" rx="6" fill="#fff" stroke="#e9e7e3"/>
  <g transform="translate(331 617)">
    <rect width="30" height="34" rx="4" fill="#f7e8e5"/>
    <path d="M8 7h9l5 5v15H8zM17 7v5h5" fill="none" stroke="#b43a29" stroke-width="1.3"/>
    <text x="15" y="23" class="ui" fill="#a63a2a" font-size="6.5" font-weight="700" text-anchor="middle">PDF</text>
