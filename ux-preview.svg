  <text x="282" y="142" class="ui" fill="#a63a2a" font-size="11" font-weight="700" letter-spacing="1.6">GESTIÓN DE DOCUMENTOS</text>
  <text x="282" y="190" class="display" fill="#202023" font-size="37">Tus PDF, en orden.</text>
  <text x="282" y="220" class="ui" fill="#77767a" font-size="14">Elige una herramienta para empezar.</text>

