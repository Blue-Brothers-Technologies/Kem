  <text x="30" y="391" class="ui" fill="#87868a" font-size="11" font-weight="700" letter-spacing="1.4">TU ESPACIO</text>
  <g transform="translate(38 414)" fill="none" stroke="#a5a4a7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 8h20v15H3zM3 8l10 8 10-8M3 8l3-5h14l3 5"/>
  </g>
  <text x="76" y="434" class="ui" fill="#c2c1c4" font-size="14">Archivos recientes</text>

  <rect x="20" y="820" width="204" height="137" rx="8" fill="#202023" stroke="#333337"/>
  <circle cx="47" cy="851" r="14" fill="#2d2220"/>
  <g transform="translate(39 843)" fill="none" stroke="#dc654f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
