  <text x="312" y="365" class="ui" fill="#262629" font-size="17" font-weight="650">Archivos para unir</text>
  <text x="312" y="389" class="ui" fill="#858489" font-size="12">Añade dos o más archivos PDF y ordénalos como prefieras.</text>

  <rect x="312" y="413" width="670" height="132" rx="7" fill="#fcfbfa" stroke="#d7d3ce" stroke-width="1.5" stroke-dasharray="6 5"/>
  <circle cx="647" cy="455" r="22" fill="#f5e9e6"/>
  <g transform="translate(636 443)" fill="none" stroke="#b43a29" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
