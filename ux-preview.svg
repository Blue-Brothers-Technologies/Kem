  <text x="337" y="281" class="ui" fill="#28282b" font-size="13" font-weight="600">Unir PDF</text>
  <g transform="translate(470 266)" fill="none" stroke="#77767a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 2h11l5 5v16H2zM13 2v6h5M4 14h12M10 11l-3 3 3 3M10 20l3-3-3-3"/>
  </g>
  <text x="501" y="281" class="ui" fill="#656469" font-size="13">Dividir PDF</text>

