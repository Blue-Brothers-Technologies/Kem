  </g>
  <text x="69" y="849" class="ui" fill="#f2f1ef" font-size="12" font-weight="600">Privacidad primero</text>
  <text x="37" y="883" class="ui" fill="#aaa9ad" font-size="11">Tus documentos se procesan</text>
  <text x="37" y="900" class="ui" fill="#aaa9ad" font-size="11">de forma local y se eliminan</text>
  <text x="37" y="917" class="ui" fill="#aaa9ad" font-size="11">al terminar.</text>

